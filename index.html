<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desi18.com - Premium Video Stream</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #181c29;
            --accent: #00e5ff;
            --download-gradient: linear-gradient(135deg, #7928ca, #ff0080);
            --text-main: #ffffff;
            --text-muted: #8c9bae;
            --border: #22293d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 30px;
        }

        /* Top Header */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent);
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .search-box {
            display: flex;
            background: #0b0d14;
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            width: 55%;
            max-width: 260px;
        }

        .search-box input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 6px 12px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .search-box button {
            background: transparent;
            border: none;
            padding: 0 10px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Container */
        .container {
            max-width: 850px;
            margin: 15px auto;
            padding: 0 10px;
        }

        /* Home View */
        #home-view {
            display: block;
        }

        .section-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid var(--accent);
            font-size: 14px;
            font-weight: 600;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
        }

        .video-card:active {
            transform: scale(0.98);
        }

        .thumb-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hd-tag {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--accent);
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 3px;
        }

        .overlay-meta {
            position: absolute;
            bottom: 5px;
            left: 5px;
            right: 5px;
            display: flex;
            justify-content: space-between;
            background: rgba(15, 17, 26, 0.85);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            color: var(--text-muted);
        }

        .card-title {
            padding: 8px;
            font-size: 12px;
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 38px;
        }

        .card-footer-info {
            background: #11141f;
            padding: 5px 8px;
            font-size: 11px;
            color: #00e676;
            text-align: center;
            border-top: 1px solid var(--border);
        }

        /* Watch View */
        #watch-view {
            display: none;
        }

        .back-btn {
            display: inline-block;
            background: #22293d;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            text-decoration: none;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .player-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        /* Unique Styled Download Button (Purple-Pink Gradient with Custom Icon) */
        .download-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: var(--download-gradient);
            color: white;
            text-align: center;
            padding: 13px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(255, 0, 128, 0.35);
            transition: 0.2s;
        }

        .download-action-btn:active {
            transform: scale(0.98);
        }

        .video-details-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid var(--accent);
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .watch-meta-bar {
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 13px;
            border: 1px solid var(--border);
        }

        .interaction-group {
            display: flex;
            gap: 10px;
        }

        .action-chip {
            background: #22293d;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .action-chip:hover {
            background: #323d5a;
        }

        /* Active/Liked State Style */
        .action-chip.liked {
            background: #00e676;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="goHome()">desi18.com</div>
        <div class="search-box">
            <input type="text" placeholder="Search...">
            <button>🔍</button>
        </div>
    </header>

    <div class="container">
        
        <!-- HOME PAGE -->
        <div id="home-view">
            <div class="section-bar">
                <span>Latest Videos</span>
                <span style="color: var(--accent); font-size: 12px;">Trending ▼</span>
            </div>

            <div class="video-grid" id="video-grid-container">
                <!-- ডাইনামিক ভিডিও লিস্ট এখানে লোড হবে -->
            </div>
        </div>

        <!-- WATCH PAGE -->
        <div id="watch-view">
            <div class="back-btn" onclick="goHome()">← Back to Videos</div>
            
            <div class="player-box">
                <iframe id="iframe-player" src="" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen></iframe>
            </div>

            <!-- Custom Download Button with Unique Icon & Gradient -->
            <a id="download-link" href="#" target="_blank" class="download-action-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v13m0 0l-5-5m5 5l5-5M4 19h16"/></svg>
                Download complete video now!
            </a>

            <div class="video-details-card" id="watch-title">
                Video Title Here
            </div>

            <div class="watch-meta-bar">
                <span id="watch-views-count">0 views</span>
                <div class="interaction-group">
                    <button class="action-chip" id="like-btn" onclick="toggleLike()">
                        👍 <span id="like-count">0</span>
                    </button>
                    <button class="action-chip" onclick="handleDislike()">
                        👎 <span id="dislike-count">0</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ভিডিও তালিকা (এখানে আপনার ভিডিওর তথ্য ও লিংক বসাবেন)
        const videos = [
            {
                id: 1,
                title: "Vellarikka (2026) Malayalam Uncut Short Film Edition",
                thumb: "https://via.placeholder.com/400x225/111/fff?text=Vellarikka+1",
                duration: "34:43",
                embedUrl: "https://doomstrm.com/embed-xyz123.html",
                downloadUrl: "#",
                baseViews: 1250,
                baseLikes: 120,
                dislikes: 2
            },
            {
                id: 2,
                title: "Niyat (2026) Kaama Hindi Hot Short Film | Watch Now",
                thumb: "https://via.placeholder.com/400x225/111/fff?text=Niyat+Film",
                duration: "27:54",
                embedUrl: "https://doomstrm.com/embed-xyz456.html",
                downloadUrl: "#",
                baseViews: 840,
                baseLikes: 95,
                dislikes: 1
            },
            {
                id: 3,
                title: "Bekaboo (2026) HotFM Hindi Uncut Hot Short Film",
                thumb: "https://via.placeholder.com/400x225/111/fff?text=Bekaboo",
                duration: "20:33",
                embedUrl: "https://doomstrm.com/embed-xyz789.html",
                downloadUrl: "#",
                baseViews: 430,
                baseLikes: 40,
                dislikes: 5
            },
            {
                id: 4,
                title: "Vellarikka 2 (2026) BabluTV Malayalam Uncut Hot Short",
                thumb: "https://via.placeholder.com/400x225/111/fff?text=Vellarikka+2",
                duration: "40:11",
                embedUrl: "https://doomstrm.com/embed-xyz012.html",
                downloadUrl: "#",
                baseViews: 2100,
                baseLikes: 310,
                dislikes: 4
            }
        ];

        let activeVideoId = null;

        // হোমপেজে কার্ড রেন্ডার করা
        function renderVideos() {
            const grid = document.getElementById('video-grid-container');
            grid.innerHTML = '';

            videos.forEach(video => {
                let viewsKey = `desi18_views_${video.id}`;
                let likesKey = `desi18_likes_${video.id}`;

                let totalViews = parseInt(localStorage.getItem(viewsKey)) || video.baseViews;
                let totalLikes = parseInt(localStorage.getItem(likesKey)) || video.baseLikes;

                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => openVideo(video.id);
                
                card.innerHTML = `
                    <div class="thumb-box">
                        <span class="hd-tag">HD</span>
                        <img src="${video.thumb}" alt="Thumbnail">
                        <div class="overlay-meta">
                            <span>👁️ ${totalViews}</span>
                            <span>⏱️ ${video.duration}</span>
                        </div>
                    </div>
                    <div class="card-title">${video.title}</div>
                    <div class="card-footer-info">👍 100% Positive</div>
                `;
                grid.appendChild(card);
            });
        }

        // ভিডিও ওপেন এবং রিয়েল ভিউ কাউন্ট সিস্টেম
        function openVideo(id) {
            activeVideoId = id;
            const video = videos.find(v => v.id === id);
            if (!video) return;

            let viewsKey = `desi18_views_${id}`;
            let sessionViewKey = `viewed_session_${id}`;
            let currentViews = parseInt(localStorage.getItem(viewsKey)) || video.baseViews;

            // শুধুমাত্র একবারই রিয়েল ভিউ বাড়বে (রিফ্রেশ করলে ডেমো বা ডাবল ভিউ হবে না)
            if (!sessionStorage.getItem(sessionViewKey)) {
                currentViews += 1;
                localStorage.setItem(viewsKey, currentViews);
                sessionStorage.setItem(sessionViewKey, 'true');
            }

            let likesKey = `desi18_likes_${id}`;
            let userLikedKey = `user_liked_status_${id}`;
            let currentLikes = parseInt(localStorage.getItem(likesKey)) || video.baseLikes;
            let hasLiked = localStorage.getItem(userLikedKey) === 'true';

            // UI আপডেট
            document.getElementById('iframe-player').src = video.embedUrl;
            document.getElementById('download-link').href = video.downloadUrl;
            document.getElementById('watch-title').innerText = video.title;
            document.getElementById('watch-views-count').innerText = `${currentViews} views`;
            document.getElementById('like-count').innerText = currentLikes;
            document.getElementById('dislike-count').innerText = video.dislikes;

            const likeBtn = document.getElementById('like-btn');
            if (hasLiked) {
                likeBtn.classList.add('liked');
            } else {
                likeBtn.classList.remove('liked');
            }

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('watch-view').style.display = 'block';
            window.scrollTo(0, 0);
        }

        // হোম পেজে ফিরে যাওয়া
        function goHome() {
            document.getElementById('iframe-player').src = '';
            document.getElementById('watch-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            renderVideos();
        }

        // একজন ইউজার শুধুমাত্র একবার লাইক দিতে পারবে (টগল সিস্টেম)
        function toggleLike() {
            if (!activeVideoId) return;

            let likesKey = `desi18_likes_${activeVideoId}`;
            let userLikedKey = `user_liked_status_${activeVideoId}`;
            
            let video = videos.find(v => v.id === activeVideoId);
            let currentLikes = parseInt(localStorage.getItem(likesKey)) || video.baseLikes;
            let hasLiked = localStorage.getItem(userLikedKey) === 'true';
            const likeBtn = document.getElementById('like-btn');

            if (!hasLiked) {
                // লাইক যোগ হবে
                currentLikes += 1;
                localStorage.setItem(likesKey, currentLikes);
                localStorage.setItem(userLikedKey, 'true');
                likeBtn.classList.add('liked');
            } else {
                // লাইক তুলে নেওয়া হবে (আগের অবস্থায় ফিরে যাবে)
                currentLikes -= 1;
                localStorage.setItem(likesKey, currentLikes);
                localStorage.setItem(userLikedKey, 'false');
                likeBtn.classList.remove('liked');
            }

            document.getElementById('like-count').innerText = currentLikes;
        }

        function handleDislike() {
            alert("Thanks for your feedback!");
        }

        // পেজ লোড হলে রান হবে
        window.onload = renderVideos;
    </script>
</body>
</html>
