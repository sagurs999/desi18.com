<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Stream - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">⚡ ModernStream</div>
        <div class="search-bar">
            <input type="text" placeholder="Search videos...">
            <button>🔍</button>
        </div>
    </nav>

    <div class="container">
        <h2 class="section-title">Trending & Latest Videos</h2>

        <div class="grid">
            <div class="card" onclick="location.href='watch.html';">
                <div class="thumbnail">
                    <span class="badge">HD</span>
                    <img src="https://via.placeholder.com/400x225/1f242c/c9d1d9?text=Stream+Preview" alt="Thumb">
                    <div class="overlay-info">
                        <span>👁️ 5.2K</span>
                        <span>⏱️ 34:43</span>
                    </div>
                </div>
                <div class="card-content">
                    <div class="card-title">Vellarikka (2026) Malayalam Uncut Short Film Edition</div>
                </div>
                <div class="card-footer">👍 100% Positive</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
